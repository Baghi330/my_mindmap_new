<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="مایندمپ تعاملی با نمایش تدریجی و طبیعی رشد درخت از داده پروژه"
    />
    <meta name="theme-color" content="#f3f5fa" />
    <title>مایندمپ</title>
    <script>
      try {
        const settings = JSON.parse(localStorage.getItem('mindmap-ai:settings:v1') || '{}')
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        const isDark = settings.theme === 'dark' || (settings.theme !== 'light' && systemDark)
        document.documentElement.dataset.preloadTheme = isDark ? 'dark' : 'light'
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', isDark ? '#0b0f16' : '#f3f5fa')
      } catch {
        // تنظیم تم اختیاری است؛ در نبود آن تم روشن استفاده می‌شود.
      }
    </script>
  </head>
  <body>
    <script>
  const make = (id, label, children = []) => ({ id, label, note: '', collapsed: false, children });
  const topics = ['پژوهش','داده','تحلیل','هوش مصنوعی','همکاری','انتشار','امنیت','زیرساخت'];
  window.__MINDMAP_DATA__ = make('root','نقشه پروژه میزبان', topics.map((t,i)=>make(`n${i}`,t,Array.from({length:4},(_,j)=>make(`n${i}-${j}`,`${t} ${j+1}`,Array.from({length:3},(_,k)=>make(`n${i}-${j}-${k}`,`جزئیات ${k+1}`)))))));
</script>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
